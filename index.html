<title>عاين AD Studio | الإعلان البخلّيك تعاين مرتين</title>
<meta name="description" content="استوديو إعلانات كرتونية بروح سودانية: أفكار، ريلز وحكايات قصيرة تخلّي الناس تتكلم عن علامتك.">

<link href="https://fonts.googleapis.com/css2?family=Lalezar&family=Readex+Pro:wght@300;400;500;600;700&display=swap" rel="stylesheet">
<style>
:root{--ink:#130F2A;--ink2:#1D1740;--saffron:#FFC21A;--coral:#FF5B3A;--teal:#19C2B0;--lilac:#8B7CFF;--paper:#F5F3FF;--text:#EDEBFA;--muted:#A9A4C9;--line:rgba(255,255,255,.14);--r:18px;--display:'Lalezar','Readex Pro',Tahoma,sans-serif;--body:'Readex Pro',Tahoma,Arial,sans-serif}
*{box-sizing:border-box}html{scroll-behavior:smooth}
body{margin:0;background:var(--ink);color:var(--text);font:400 1rem/1.8 var(--body);-webkit-font-smoothing:antialiased}
button,input,textarea,select{font:inherit}a{color:inherit;text-decoration:none}img,svg{display:block;max-width:100%}
:focus-visible{outline:3px solid var(--saffron);outline-offset:3px;border-radius:8px}
.wrap{width:min(1180px,92%);margin:auto}
.ico{width:1.25em;height:1.25em;fill:none;stroke:currentColor;stroke-width:1.8;stroke-linecap:round;stroke-linejoin:round;flex:none}

/* nav */
.topbar{position:sticky;top:0;z-index:40;background:rgba(19,15,42,.88);backdrop-filter:blur(14px);border-bottom:1px solid var(--line)}
.nav{display:flex;align-items:center;justify-content:space-between;gap:16px;min-height:74px}
.brand{display:flex;align-items:center;gap:12px;font:400 1.55rem/1 var(--display)}
.brand small{display:block;font:300 .68rem/1.3 var(--body);color:var(--muted);margin-top:4px}
.logo{display:grid;place-items:center;width:44px;height:44px;border-radius:14px;background:var(--saffron);color:var(--ink);font:400 1.6rem/1 var(--display);border:2px solid #000;box-shadow:-3px 3px 0 var(--coral);transform:rotate(-4deg)}
.links{display:flex;gap:6px;align-items:center}
.links a{padding:8px 14px;border-radius:99px;font-size:.92rem;color:#d4d0ee;transition:background .2s,color .2s}
.links a:hover{background:#ffffff12;color:#fff}
.links a.active,.mobileLinks a.active{background:var(--saffron);color:var(--ink);font-weight:600}
.menu{display:none}.mobileLinks{display:none}

/* buttons */
.btn{border:2px solid #000;cursor:pointer;border-radius:14px;padding:12px 22px;font-weight:600;display:inline-flex;align-items:center;justify-content:center;gap:10px;background:#fff;color:var(--ink);box-shadow:-4px 4px 0 #000;transition:transform .15s,box-shadow .15s;touch-action:manipulation}
.btn:hover:not(:disabled){transform:translate(2px,-2px);box-shadow:-6px 6px 0 #000}
.btn:active:not(:disabled){transform:translate(-2px,2px);box-shadow:-1px 1px 0 #000}
.btn:disabled{opacity:.55;cursor:not-allowed;box-shadow:none;transform:none}
.primary{background:var(--saffron)}.secondary{background:transparent;color:#fff;border-color:#ffffff55;box-shadow:none}
.secondary:hover:not(:disabled){box-shadow:none;transform:none;background:#ffffff14}
.smallbtn{padding:8px 16px;font-size:.9rem;box-shadow:-3px 3px 0 #000}
.btn .ico{transform:scaleX(-1)}

/* views */
main .page-view{display:none;min-height:calc(100vh - 74px)}
main .page-view.active{display:block;animation:pageIn .35s ease both}
@keyframes pageIn{from{opacity:0;transform:translateY(8px)}to{opacity:1;transform:none}}
.light{background:var(--paper);color:#1d1a33}
.pageTop{padding:60px 0 8px}
.pageTop h1{font:400 clamp(2.4rem,5vw,3.8rem)/1.15 var(--display);margin:0 0 10px}
.pageTop p{margin:0;color:var(--muted);max-width:60ch}.light .pageTop p{color:#5d5a7e}
.pageContent{padding:36px 0 90px}
.tag{display:inline-flex;align-items:center;gap:8px;padding:5px 14px;border-radius:99px;font-size:.82rem;font-weight:500;background:var(--teal);color:var(--ink);border:2px solid #000;margin-bottom:16px}

/* hero */
.hero{position:relative;overflow:hidden;background:radial-gradient(60% 70% at 85% 10%,#8b7cff33,transparent 70%),radial-gradient(50% 60% at 5% 90%,#ff5b3a2b,transparent 70%)}
.heroGrid{display:grid;grid-template-columns:1.1fr .9fr;gap:40px;align-items:center;padding:70px 0 80px}
.hero h1{font:400 clamp(3rem,7.4vw,6rem)/1.05 var(--display);margin:0 0 22px}
.hero h1 em{display:inline-block;font-style:normal;background:var(--saffron);color:var(--ink);padding:0 .25em .08em;border:3px solid #000;border-radius:14px;box-shadow:-6px 6px 0 var(--coral);transform:rotate(-2deg);margin-top:.15em}
.hero p.lead{color:#cbc7e8;font-size:1.12rem;max-width:52ch;margin:0 0 30px}
.actions{display:flex;flex-wrap:wrap;gap:14px}
.proof{display:flex;gap:10px 24px;flex-wrap:wrap;margin-top:36px;color:var(--muted);font-size:.9rem}
.proof span{display:inline-flex;align-items:center;gap:8px}.proof .ico{color:var(--teal)}
.heroArt{position:relative;display:grid;place-items:center;min-height:480px}
.phone{width:min(300px,78%);aspect-ratio:9/17;border:3px solid #000;border-radius:38px;background:var(--lilac);box-shadow:-14px 14px 0 var(--saffron),-14px 14px 0 3px #000;transform:rotate(3deg);overflow:hidden;position:relative}
.phone svg{width:100%;height:100%}
.sticker{position:absolute;padding:10px 16px;border:2px solid #000;border-radius:14px;font-weight:600;font-size:.9rem;color:var(--ink);box-shadow:-4px 4px 0 #000;display:flex;align-items:center;gap:8px}
.s1{top:46px;right:-4px;background:#fff;transform:rotate(4deg)}.s2{bottom:70px;left:-6px;background:var(--teal);transform:rotate(-5deg)}
.float{animation:bob 5s ease-in-out infinite}.s2.float{animation-delay:-2.5s}
@keyframes bob{50%{translate:0 -8px}}

/* marquee */
.marquee{background:var(--saffron);color:var(--ink);border-block:3px solid #000;overflow:hidden;transform:rotate(-1deg);margin:10px -2%}
.track{display:flex;gap:44px;width:max-content;padding:14px 0;font:400 1.6rem/1 var(--display);animation:slide 34s linear infinite}
.track span{display:inline-flex;align-items:center;gap:44px}.track span:after{content:"✺";color:var(--coral)}
@keyframes slide{to{transform:translateX(50%)}}

/* process */
.section{padding:90px 0}
.sectionHead{margin-bottom:40px;max-width:640px}
.sectionHead h2{font:400 clamp(2rem,4vw,3rem)/1.2 var(--display);margin:0 0 8px}
.sectionHead p{margin:0;color:var(--muted)}.light .sectionHead p{color:#5d5a7e}
.steps{display:grid;grid-template-columns:repeat(4,1fr);gap:18px;counter-reset:s}
.step{position:relative;padding:26px 22px;border:2px solid var(--line);border-radius:var(--r);background:var(--ink2);counter-increment:s}
.step:before{content:counter(s);display:grid;place-items:center;width:42px;height:42px;border-radius:50%;background:var(--c,var(--saffron));color:var(--ink);font:400 1.4rem/1 var(--display);border:2px solid #000;margin-bottom:16px}
.step:nth-child(2){--c:var(--teal)}.step:nth-child(3){--c:var(--coral)}.step:nth-child(4){--c:var(--lilac)}
.step h3{margin:0 0 6px;font:400 1.4rem/1.3 var(--display)}.step p{margin:0;color:var(--muted);font-size:.93rem}
.cta{margin:0 auto 90px;padding:48px;border:3px solid #000;border-radius:28px;background:var(--coral);color:var(--ink);display:flex;justify-content:space-between;align-items:center;gap:24px;flex-wrap:wrap;box-shadow:-10px 10px 0 var(--saffron),-10px 10px 0 3px #000}
.cta h2{font:400 clamp(1.9rem,4vw,3rem)/1.2 var(--display);margin:0}

/* services */
.serviceGrid{display:grid;grid-template-columns:1.3fr 1fr 1fr;gap:20px}
.service{padding:28px;border:3px solid #000;border-radius:24px;background:#fff;box-shadow:-6px 6px 0 #000;display:flex;flex-direction:column;transition:transform .2s}
.service:hover{transform:translateY(-4px)}
.service:nth-child(1){background:var(--saffron)}.service:nth-child(2){background:var(--teal)}.service:nth-child(3){background:#fff}
.serviceIcon{display:grid;place-items:center;width:60px;height:60px;border-radius:18px;background:var(--ink);color:#fff;font-size:1.6rem;margin-bottom:22px}
.service h3{margin:0 0 8px;font:400 1.7rem/1.2 var(--display)}.service p{margin:0 0 22px;color:#2b2650;flex:1}
.textLink{display:inline-flex;align-items:center;gap:8px;font-weight:600;color:var(--ink);cursor:pointer;border-bottom:2px solid var(--ink);align-self:flex-start;padding-bottom:2px}

/* ideas */
.ideaLayout{display:grid;grid-template-columns:.85fr 1.15fr;gap:48px;align-items:start}
.ideaIntro h2{font:400 clamp(2rem,4vw,3rem)/1.25 var(--display);margin:0 0 14px}.ideaIntro p{color:var(--muted);max-width:44ch}
